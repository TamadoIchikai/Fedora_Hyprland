[dmenu]
dmenu_command = fuzzel -a bottom-right --x-margin 30 --line-height 22 --minimal-lines --counter --horizontal-pad 16 --font "JetBrainsMono Nerd Font Mono:size=12"
active_chars = ==
active_icon = ~/.config/networkmanager-dmenu/active.svg
highlight = True
highlight_fg =
highlight_bg =
highlight_bold = True
compact = False
pinentry =
wifi_icons = 󰤯󰤟󰤢󰤥󰤨
format = {icon}  {name:<{max_len_name}s}    {sec:<{max_len_sec}s}
list_saved = False
prompt = Networks

[dmenu_passphrase]
obscure = False
obscure_color = #222222

[pinentry]
description = Get network password
prompt = Password:

[editor]
terminal = foot
gui_if_available = True
gui = nm-connection-editor

[nmdm]
rescan_delay = 5
