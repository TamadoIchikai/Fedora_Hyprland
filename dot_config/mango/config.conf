# ============================================================
#  mango config — migrated from ~/.config/hypr/hyprland.lua
#  Validate:  mango -c ~/.config/mango/config.conf -p
#  Reload:    mmsg dispatch reload_config
# ============================================================

# -------------------- VARIABLES --------------------
var=term,foot
var=file,thunar --window
var=menu,fuzzel-scale.sh
var=browser,zen
var=browser2,Helium.AppImage
var=screenshot,grim -g "$(slurp)" - | GTK_THEME=Adwaita:dark swappy -f -
var=clipboard,wofi-cliphist.sh
var=powermenu,fuzzel-powermenu.sh
var=calc,qalc_floating.sh
var=colorpicker,$HOME/.config/hypr/scripts/hyprPicker.sh
var=display,fuzzel-DisplayMode.sh --fuzzel
var=keyboard,$HOME/.local/bin/fcitx5_changeKeyboard.sh

# -------------------- ENVIRONMENT --------------------
env=XCURSOR_SIZE,24
cursor_size=24
auto_reload_config=1

# -------------------- AUTOSTART --------------------
# Display picker needs these to calculate layouts (see fuzzel-DisplayMode.sh)
env=LAPTOP_OUTPUT,eDP-1
env=EXTERNAL_OUTPUT,HDMI-A-1
env=LAPTOP_MODE,1920x1080@60
env=EXTERNAL_MODE,1920x1080@60
env=LAPTOP_POS,0x0
env=EXTERNAL_POS_EXTEND,1920x0
env=EXTERNAL_POS_ONLY,0x0
env=EXTERNAL_POS_MIRROR,0x0
env=LAPTOP_SCALE,1
env=EXTERNAL_SCALE,1
env=DUAL_MONITOR_MODE,external

exec_once=systemctl --user start mango-session.target
exec_once=/home/tamadoichikai/.local/bin/mango-autostart.sh

# -------------------- MONITORS --------------------
monitor_rule=name:^eDP-1$,width:1920,height:1080,refresh:60.1,x:0,y:0,scale:1
monitor_rule=name:^HDMI-A-1$,width:1920,height:1080,refresh:60.0,x:1920,y:0,scale:1

# -------------------- LOOK AND FEEL --------------------
gap_inner_horizontal=2
gap_inner_vertical=2
gap_outer_horizontal=5
gap_outer_vertical=5
border_px=2
focus_color=0x9198A1aa
border_color=0x2B2B2Baa
border_radius=5
focused_opacity=1.0
unfocused_opacity=1.0

# -------------------- EFFECTS --------------------
blur=0
blur_layer=0
shadows=1
layer_shadows=0
shadow_only_floating=1
shadows_size=8
shadows_blur=8
shadows_position_x=0
shadows_position_y=0
shadows_color=0xee1a1a1a

# -------------------- ANIMATIONS --------------------
animations=1
layer_animations=1
animation_type_open=fade
animation_type_close=fade
layer_animation_type_open=slide
layer_animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
fade_in_begin_opacity=0.0
fade_out_begin_opacity=0.0
tag_animation_direction=1
animation_duration_move=180
animation_duration_open=180
animation_duration_tag=180
animation_duration_close=180
animation_duration_focus=0
animation_curve_open=0.23,1.0,0.32,1
animation_curve_move=0.23,1.0,0.32,1
animation_curve_tag=0.65,0.05,0.36,1
animation_curve_close=0,0,1,1
animation_curve_focus=0.65,0.05,0.36,1
animation_curve_opacity_fade_in=0.23,1.0,0.32,1
animation_curve_opacity_fade_out=0.65,0.05,0.36,1

# -------------------- LAYOUTS --------------------
dwindle_split_ratio=0.5
dwindle_smart_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=1
dwindle_smart_resize=1
dwindle_drop_simple_split=1

new_is_master=0
default_master_factor=0.6
default_master_count=1
tag_num=9

scroller_structs=20
scroller_focus_center=0
scroller_prefer_center=0

monocle_tab_mode=1
monocle_no_border=0
monocle_no_gap=0

# -------------------- MISC --------------------
focus_on_activate=1
sloppy_focus=1
focus_cross_monitor=0
focus_direction_only_zone_overlap=1
no_border_when_single=0
enable_floating_snap=0
snap_distance=30
axis_bind_apply_timeout=100
xwayland_persistence=1

# -------------------- INPUT --------------------
repeat_rate=25
repeat_delay=600
numlock_on=1
xkb_rules_layout=us
xkb_rules_options=caps:swapescape

mouse_accel_profile=1
trackpad_natural_scrolling=1
trackpad_scroll_factor=0.2
trackpad_disable_while_typing=1

device_rule=name:instant-usb-gaming-mouse-,accel_speed:-0.4
device_rule=name:elan1200:00-04f3:3090-touchpad,accel_speed:0.35
device_rule=name:compx-2.4g-receiver-mouse,accel_speed:-0.15

# -------------------- TAG RULES --------------------
tag_rule=id:*,layout_name:dwindle

# -------------------- WINDOW RULES --------------------
# (class -> app_id, size fractions kept, offsets = (fraction+size/2-0.5)*200)
# autostart popup (WM_exec_floating is a no-op on mango; float by title)
window_rule=is_floating:1,width:0.55,height:0.60,title:^AutostartTestPopup$
# pavucontrol
window_rule=is_floating:1,width:0.3385,height:0.3704,offset_x:90,offset_y:99,app_id:^org.pulseaudio.pavucontrol$
# blueman-manager
window_rule=is_floating:1,width:0.2755,height:0.3194,offset_x:97,offset_y:99,app_id:blueman-manager
# GTK portal: Files dialog
window_rule=is_floating:1,width:0.3646,height:0.3704,offset_x:98,offset_y:99,app_id:^xdg-desktop-portal-gtk$,title:^Files$
# GTK choose directory
window_rule=is_floating:1,width:0.3599,height:0.4759,offset_x:100,offset_y:97,app_id:^xdg-desktop-portal-gtk$,title:^Choose Directory$
# generic xdg-desktop-portal-gtk (also browser download dialogs)
window_rule=is_floating:1,app_id:^xdg-desktop-portal-gtk$
# AB download manager
window_rule=is_floating:1,app_id:com-abdownloadmanager-desktop-AppKt
# zenity devices dialog
window_rule=is_floating:1,width:0.2604,height:0.3704,offset_x:92,offset_y:99,app_id:^zenity$,title:^Devices$
# Mailspring
window_rule=is_floating:1,width:1884,height:1026,app_id:^Mailspring$
# LocalSend
window_rule=is_floating:1,width:0.2906,height:0.5352,offset_x:97,offset_y:99,app_id:^org.localsend.localsend_app$,title:^LocalSend$
window_rule=is_floating:1,width:0.3807,height:0.5352,offset_x:100,offset_y:99,app_id:^localsend_app$,title:^Open File$
# swayimg
window_rule=is_floating:1,app_id:^swayimg$
# Xournal++ popups
window_rule=is_floating:1,app_id:^com.github.xournalpp.xournalpp$,title:^Xournalpp - New bookmark$
window_rule=is_floating:1,width:477,height:326,app_id:^com.github.xournalpp.xournalpp$,title:^Xournalpp - Bookmarks Manager$
# XWayland drag fix (empty class/title)
window_rule=is_open_silent:1,app_id:^$,title:^$
# hyprmode (lid switch handling window)
window_rule=is_floating:1,width:600,height:530,focused_opacity:0.95,unfocused_opacity:0.95,app_id:^hyprmode$
# hyprland dialog
window_rule=is_floating:1,app_id:^hyprland-dialog$
# File Roller extraction popup
window_rule=is_floating:1,app_id:^org.gnome.FileRoller$
# Thunar popups
window_rule=is_floating:1,app_id:(?i)^thunar$,title:^Confirm to replace files$
window_rule=is_floating:1,app_id:(?i)^thunar$,title:^File Operation Progress$
window_rule=is_floating:1,app_id:(?i)^thunar$,title:^Rename .*$
# Vivaldi popups
window_rule=is_floating:1,app_id:^vivaldi-stable$,title:^Bitwarden - Vivaldi$
window_rule=is_floating:1,app_id:^vivaldi-stable$,title:^Open File$
# KeePassXC (popups before generic class rule so they keep their own size)
window_rule=is_floating:1,app_id:^org.keepassxc.KeePassXC$,title:^KeePassXC - Browser Access Request$
window_rule=is_floating:1,app_id:^org.keepassxc.KeePassXC$,title:^Generate Password$
window_rule=is_floating:1,width:1567,height:929,app_id:^org.keepassxc.KeePassXC$
# CopyQ menu
window_rule=is_floating:1,app_id:^com.github.hluk.copyq$,title:^CopyQ$
# peazip
window_rule=is_floating:1,app_id:^peazip$
# VSCode dialogs
window_rule=is_floating:1,app_id:^code$,title:^Open Folder$
window_rule=is_floating:1,app_id:^code$,title:^Open File$
# Seahorse
window_rule=is_floating:1,app_id:^org.gnome.seahorse.Application$,title:^Passwords and Keys$
# BetterBird
window_rule=is_floating:1,width:1906,height:1033,app_id:^eu.betterbird.Betterbird$
# Obsidian -> tag 1
window_rule=tags:1,app_id:^md.obsidian.Obsidian$
# KDE file picker
window_rule=is_floating:1,width:1018,height:622,app_id:^org.freedesktop.impl.portal.desktop.kde$
# Zotero new collection
window_rule=width:430,height:180,app_id:^Zotero$,title:^New Collection$

# -------------------- LAYER RULES --------------------
layer_rule=no_animation:1,no_blur:1,layer_name:^selection$
layer_rule=animation_type_open:slide,animation_type_close:fade,layer_name:^(rofi|wofi|fuzzel)$

# -------------------- KEY BINDINGS --------------------
key_mode=default

# apps
bind=SHIFT,backspace,spawn_shell,wtype -k delete
bind=SUPER,Z,spawn,$term
bind=SUPER,E,spawn,$file
bind=SUPER+ALT,E,spawn_shell,flatpak run eu.betterbird.Betterbird -mail
bind=SUPER,O,spawn,$menu
bind=SUPER,B,spawn,$browser
bind=SUPER+ALT,B,spawn,$browser2
bind=SUPER,G,spawn_shell,$screenshot
bind=SUPER+ALT,G,spawn_shell,$colorpicker
bind=SUPER,V,spawn,$clipboard
bind=SUPER+ALT,P,spawn,$powermenu
bind=SUPER,P,spawn,$display
bind=SUPER,SPACE,spawn_shell,$keyboard
bind=ALT,O,spawn,$calc
bind=ALT,Tab,switcher,all_next
bind=SUPER+CTRL,X,spawn,chezmoi apply
bind=SUPER+ALT,X,spawn_shell,$HOME/.config/waybar/scripts/restartWaybar.sh
bind=SUPER+ALT+CTRL,P,reload_config
bind=SUPER+ALT,C,reload_config

# window state
bind=SUPER,C,togglefloating
bind=SUPER,F,togglefullscreen
bind=SUPER,Q,killclient

# focus (vim keys)
bind=SUPER,H,focusdir,left
bind=SUPER,L,focusdir,right
bind=SUPER,K,focusdir,up
bind=SUPER,J,focusdir,down

# move active window
bind=SUPER+ALT,H,move_client,left
bind=SUPER+ALT,L,move_client,right
bind=SUPER+ALT,K,move_client,up
bind=SUPER+ALT,J,move_client,down

# resize key mode
bind=SUPER,R,setkeymode,resize
key_mode=resize
bind=NONE,l,resizewin,+40,+0
bind=NONE,h,resizewin,-40,+0
bind=NONE,j,resizewin,+0,+40
bind=NONE,k,resizewin,+0,-40
bind=NONE,Escape,setkeymode,default
key_mode=default

# groups
bind=SUPER,N,groupjoin,left
bind=SUPER+ALT,N,groupleave
bind=ALT,S,groupfocus,next
bind=ALT,D,groupfocus,prev

# tag navigation
bind=SUPER,Tab,view,-1,0
bind=SUPER,D,viewtoright,0
bind=SUPER,S,viewtoleft,0
bind=SUPER+ALT,D,tagtoright,0
bind=SUPER+ALT,S,tagtoleft,0

# view tag 1-9
bind=ALT,1,view,1,0
bind=ALT,2,view,2,0
bind=ALT,3,view,3,0
bind=ALT,4,view,4,0
bind=ALT,5,view,5,0
bind=ALT,6,view,6,0
bind=ALT,7,view,7,0
bind=ALT,8,view,8,0
bind=ALT,9,view,9,0

# move client to tag 1-9 (and focus)
bind=ALT+SHIFT,1,tag,1,0
bind=ALT+SHIFT,2,tag,2,0
bind=ALT+SHIFT,3,tag,3,0
bind=ALT+SHIFT,4,tag,4,0
bind=ALT+SHIFT,5,tag,5,0
bind=ALT+SHIFT,6,tag,6,0
bind=ALT+SHIFT,7,tag,7,0
bind=ALT+SHIFT,8,tag,8,0
bind=ALT+SHIFT,9,tag,9,0

# move client to tag 1-9 (silent)
bind=ALT+CTRL+SHIFT,1,tagsilent,1
bind=ALT+CTRL+SHIFT,2,tagsilent,2
bind=ALT+CTRL+SHIFT,3,tagsilent,3
bind=ALT+CTRL+SHIFT,4,tagsilent,4
bind=ALT+CTRL+SHIFT,5,tagsilent,5
bind=ALT+CTRL+SHIFT,6,tagsilent,6
bind=ALT+CTRL+SHIFT,7,tagsilent,7
bind=ALT+CTRL+SHIFT,8,tagsilent,8
bind=ALT+CTRL+SHIFT,9,tagsilent,9

# media keys (locked = work on lock screen)
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl s 10%+
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl s 10%-
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
bindlc=NONE,XF86AudioPause,spawn,playerctl play-pause
bindlc=NONE,XF86AudioPlay,spawn,playerctl play-pause

# -------------------- MOUSE BINDINGS --------------------
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=SUPER,btn_middle,killclient

# -------------------- AXIS BINDINGS --------------------
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# -------------------- GESTURE BINDINGS --------------------
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewtoleft_have_client
gesturebind=none,left,4,viewtoright_have_client
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview
