# main config
# NOTE: formerly named mpv.config, which mpv never loads. mpv 0.41 only reads mpv.conf.
osc=no
# Drag the window by the title bar only. With this on, left click would be
# consumed by the drag handler and pointer-event drops single/long clicks
# outside fullscreen (see script-opts/pointer-event.conf).
window-dragging=no
include=~~/profiles.conf